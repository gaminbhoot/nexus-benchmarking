# RTX 3050 4GB VRAM/precision stress matrix.
# Run ONE cell per invocation (set model/imgsz/batch/precision), record the
# headline numbers below, and stop when OOM marks the boundary. The boundary —
# not the biggest passing cell — is the result of this profile.
#
#   cell: model=YOLO26m imgsz=320 batch=1 fp16  -> expect: fits (reference workload)
#   cell: model=YOLO26m imgsz=640 batch=1 fp16  -> expect: fits (reference workload)
#   cell: model=YOLO26m imgsz=640 batch=4 fp16  -> watch: batch throughput vs VRAM
#   cell: model=NEXUS    imgsz=640 batch=1 fp16 -> the deployment question
#   cell: model=NEXUS    imgsz=640 batch=1 fp32 -> fp16 saving, measured
#   cell: model=NEXUS    imgsz=960 batch=1 fp16 -> expect: OOM or heavy misses
#
# Or sweep in one go (inference module only):
#   nexus-bench inference memory --profile profiles/rtx3050_4gb.yaml
profile_base: uav
modules: [system, inference, memory, thermal]
model: ""
imgsz_list: [320, 480, 640]
batch_list: [1, 2, 4]
precision: fp16
device: cuda
repeats: 30
warmup: 5
duration_s: 30
req_fps: 15
seed: 0

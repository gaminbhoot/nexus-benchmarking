[project]
name = "nexus-benchmarking"
version = "1.0.1"
description = "Hardware-aware benchmarking utility for the NEXUS autonomous air-ground robotic system"
readme = "README.md"
requires-python = ">=3.10"
# Pinned == the qualification lock (requirements.lock): this appliance must
# install deterministically. Bump only with re-validation + qual version review.
dependencies = [
    "numpy==2.5.3",
    "psutil==7.2.2",
    "opencv-python==5.0.0.93",
    "torch==2.14.1",
    "ultralytics==8.4.171",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nexus-bench = "nexus_bench.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

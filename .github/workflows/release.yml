name: seller-release
# Tag `v*` -> build the seller distribution on all three OSes -> publish every
# artifact to the GitHub Release with SHA256SUMS. Windows/Linux/macOS builds are
# equal-status official artifacts (plus per-OS PyInstaller bundles, experimental).
on:
  push:
    tags:
      - "v*"

jobs:
  build-dist:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest
      - name: Verify official assets
        run: |
          python -c "from nexus_bench.assets import verify_assets; ok,recs=verify_assets(); print(recs); assert ok, recs"
      - name: Build seller distribution
        run: |
          python tools/build_release.py
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build-dist
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd artifacts && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/SHA256SUMS.txt
          generate_release_notes: false

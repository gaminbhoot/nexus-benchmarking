name: qualification-ci
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
      - name: Unit + regression tests
        run: |
          python -m pytest tests/ -q --ignore=tests/test_seller.py -p no:cacheprovider
      - name: Seller integration (short appliance run)
        run: |
          python -m pytest tests/test_seller.py -q -p no:cacheprovider
        timeout-minutes: 25

  release-integrity:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no dev extras needed)
        run: |
          python -m pip install -e . --no-deps
          python -m pip install numpy psutil pyyaml
      - name: Verify official assets
        run: |
          python -c "from nexus_bench.assets import verify_assets; ok,recs=verify_assets(); print(recs); assert ok, recs"
      - name: Build seller distribution
        run: |
          python tools/build_release.py
      - name: Release artifact checksum
        run: |
          ls -l dist/ && cat dist/*.sha256

  one-binary-exe:
    # EXPERIMENTAL: per-OS PyInstaller bundles of the seller appliance.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    needs: release-integrity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime + pyinstaller
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pyinstaller
      - name: Build NEXUS_Qualification bundle
        run: |
          pyinstaller nexus_qualify.spec --noconfirm
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS_Qualification-${{ matrix.os }}
          path: dist/NEXUS_Qualification/
